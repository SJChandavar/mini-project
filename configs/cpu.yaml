# CPU configuration for fast training and experimentation
project:
  name: "Automated Tooth Segmentation (CPU)"
  seed: 42

dataset:
  root: "./data/raw"
  images: "./data/raw/images"
  tooth_masks: "./data/raw/tooth_masks"

split:
  train: 0.70
  validation: 0.15
  test: 0.15

image:
  width: 128
  height: 128
  channels: 1

training:
  epochs: 2
  batch_size: 16
  num_workers: 0
  early_stopping_patience: 10
  mixed_precision: false

optimizer:
  name: "adam"
  learning_rate: 0.0001
  weight_decay: 0.0

loss:
  name: "bce"

model:
  name: "unetplusplus_eca"
  encoder_channels: [32, 64, 128, 256, 512]
  dropout: 0.1
  eca:
    enabled: true

inference:
  threshold: 0.5
  device: "cpu"

augmentation:
  enabled: true
